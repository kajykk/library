services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      KB_DATABASE_URL: postgresql+psycopg2://kb:kb@db:5432/knowledge_base
      KB_API_TOKEN: ${KB_API_TOKEN:-change-me}
      KB_DATA_DIR: /data
      KB_CORS_ORIGINS: ${KB_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      KB_AUTO_CREATE_TABLES: "0" # 生产走 Alembic
    volumes:
      - kb-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: knowledge_base
    volumes:
      - kb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d knowledge_base"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    # 注意：NEXT_PUBLIC_* 为构建期内联变量，运行时 environment 注入无效；
    # 如需变更请修改 build.args 后重新 build。
    # 安全约束：不要把 KB_API_TOKEN 传进 build.args —— 它会被内联进客户端 bundle，
    # 任何人 view-source 即可拿到全站写权限。Token 在运行时由设置页写入浏览器
    # localStorage（见 src/app/settings/page.tsx）。
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kb-data:
  kb-pgdata:
