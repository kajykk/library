# 官方 gitleaks hook：rev 固定、入口自动由 pre-commit 环境安装，
# 不再依赖本机绝对路径（E:/code/.tools/gitleaks.exe 换机即坏）。
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

# Next.js ESLint：linter（项目用 .eslintrc.json legacy config，eslint 8）
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (Next.js)
        entry: npx eslint src --ext .ts,.tsx
        language: system
        files: ^src/.*\.tsx?$
        pass_filenames: false
        types: [file]