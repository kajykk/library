name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest tests -q
      # 依赖漏洞扫描：仅警告不阻断（已知告警可能来自无法升级的传递依赖）
      - name: Audit Python dependencies (warnings only)
        run: |
          python -m pip install pip-audit
          pip-audit
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests (vitest)
        run: npx vitest run
      # 依赖漏洞扫描：仅警告不阻断（npm audit 对传递依赖常报无法修复的告警）
      - name: Audit production dependencies (warnings only)
        run: npm audit --omit=dev
        continue-on-error: true
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build frontend (next start 需要 .next 产物)
        run: npm run build
      - name: Run e2e smoke tests
        run: npm run test:e2e
