name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的新推送取消过期 run，避免双倍运行与排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 工作流 / Dockerfile / compose 的静态校验（镜像实际构建留给发布流程）
  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 防止 ci.yml 再次出现 needs/steps 粘连这类 YAML/语义错误
      - name: Lint GitHub Actions workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
      - name: Validate docker compose file
        run: docker compose -f docker-compose.yml config -q
      # 仅 error 级别阻断；既有 warning（版本未 pin 等）落报告但不拖红 CI
      - name: Lint Dockerfiles (hadolint)
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:latest \
            hadolint --failure-threshold error \
            Dockerfile server/Dockerfile db/Dockerfile 2>&1 | tee hadolint-report.txt
      - name: Upload hadolint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hadolint-report
          path: hadolint-report.txt
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest tests -q
      # 依赖漏洞扫描：不阻断构建，但结果必须落 artifact + step summary，不能在日志里丢弃
      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          set +e
          pip-audit --desc 2>&1 | tee pip-audit.txt
          status=${PIPESTATUS[0]}
          {
            echo "### pip-audit"
            echo '```'
            tail -n 50 pip-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: server/pip-audit.txt
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      # 依赖漏洞扫描：不阻断构建，但结果必须落 artifact + step summary，不能在日志里丢弃
      - name: Audit production dependencies
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev 2>&1 | tee npm-audit.txt
          status=${PIPESTATUS[0]}
          {
            echo "### npm audit (production)"
            echo '```'
            tail -n 50 npm-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit.txt
          retention-days: 7
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build frontend (next start 需要 .next 产物)
        run: npm run build
      - name: Run e2e smoke tests
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 3
