name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的新推送取消过期 run，避免双倍运行与排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 三个 Dockerfile 与 compose 的语法校验（镜像实际构建留给发布流程）
  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: docker compose -f docker-compose.yml config -q
      - name: Lint Dockerfiles (hadolint, warnings only)
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
          hadolint Dockerfile server/Dockerfile db/Dockerfile || true

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest tests -q
      # 依赖漏洞扫描：仅警告不阻断（已知告警可能来自无法升级的传递依赖）
      - name: Audit Python dependencies (warnings only)
        run: |
          python -m pip install pip-audit
          pip-audit
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      # 依赖漏洞扫描：仅警告不阻断（npm audit 对传递依赖常报无法修复的告警）
      - name: Audit production dependencies (warnings only)
        run: npm audit --omit=dev
        continue-on-error: true
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build frontend (next start 需要 .next 产物)
        run: npm run build
      - name: Run e2e smoke tests
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 3
